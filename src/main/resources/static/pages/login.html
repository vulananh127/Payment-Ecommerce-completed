<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập / Đăng ký - ShopVLA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; min-height:100vh; display:flex; flex-direction:column; }
    nav { background:#fff; border-bottom:1px solid #eee; padding:0 2rem; display:flex; align-items:center; height:60px; }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; }
    .logo span { color:#e53935; }
    .auth-container { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .auth-box { background:#fff; border-radius:12px; border:1px solid #eee; padding:2.5rem; width:100%; max-width:420px; }
    .tabs { display:flex; border-bottom:1px solid #eee; margin-bottom:2rem; }
    .tab { flex:1; text-align:center; padding:0.75rem; cursor:pointer; font-size:0.95rem; color:#888; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.2s; }
    .tab.active { color:#111; border-bottom-color:#111; font-weight:600; }
    .form { display:none; }
    .form.active { display:block; }
    .form-group { margin-bottom:1.25rem; }
    label { display:block; font-size:0.875rem; font-weight:500; color:#444; margin-bottom:0.4rem; }
    input { width:100%; padding:0.75rem 1rem; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; outline:none; transition:border 0.2s; }
    input:focus { border-color:#111; }
    .btn { width:100%; padding:0.85rem; background:#111; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:0.5rem; }
    .btn:hover { background:#333; }
    .btn:disabled { background:#aaa; cursor:not-allowed; }
    .error-msg { background:#fff3f3; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px; padding:0.75rem 1rem; font-size:0.875rem; margin-bottom:1rem; display:none; }
    .success-msg { background:#f0faf4; color:#27ae60; border:1px solid #b7dfcb; border-radius:8px; padding:0.75rem 1rem; font-size:0.875rem; margin-bottom:1rem; display:none; }
    .loading { display:none; text-align:center; color:#888; font-size:0.875rem; margin-top:0.5rem; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">Shop<span>VLA</span></a>
</nav>
<div class="auth-container">
  <div class="auth-box">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
      <div class="tab" onclick="switchTab('register')">Đăng ký</div>
    </div>

    <!-- Đăng nhập -->
    <div class="form active" id="loginForm">
      <div class="error-msg" id="loginError"></div>
      <div class="success-msg" id="loginSuccess"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="example@gmail.com" />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" />
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">Đăng nhập</button>
      <div class="loading" id="loginLoading">Đang đăng nhập...</div>
    </div>

    <!-- Đăng ký -->
    <div class="form" id="registerForm">
      <div class="error-msg" id="registerError"></div>
      <div class="success-msg" id="registerSuccess"></div>
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="registerName" placeholder="Nguyễn Văn A" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="example@gmail.com" />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="registerPassword" placeholder="Tối thiểu 8 ký tự" />
      </div>
      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="registerConfirm" placeholder="Nhập lại mật khẩu" />
      </div>
      <button class="btn" id="registerBtn" onclick="handleRegister()">Tạo tài khoản</button>
      <div class="loading" id="registerLoading">Đang đăng ký...</div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Nếu đã đăng nhập rồi thì redirect luôn
  if (isLoggedIn()) window.location.href = '/';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  }

  function showMsg(id, msg, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
    if (type === 'error') setTimeout(() => el.style.display = 'none', 4000);
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showMsg('loginError', 'Vui lòng nhập đầy đủ thông tin.');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    document.getElementById('loginLoading').style.display = 'block';

    try {
      const data = await apiLogin(email, password);

      showMsg('loginSuccess', 'Đăng nhập thành công! Đang chuyển trang...', 'success');

      setTimeout(() => {
        // Lấy role từ user đã lưu trong localStorage
        const user = getUser();
        const role = user?.role || 'USER';

        // Nếu có trang redirect trước đó thì ưu tiên
        const redirect = sessionStorage.getItem('redirectAfterLogin');
        sessionStorage.removeItem('redirectAfterLogin');

        if (redirect) {
          window.location.href = redirect;
        } else if (role === 'ADMIN' || role === 'SHOP') {
          window.location.href = '/pages/admin-orders.html';
        } else {
          window.location.href = '/index.html';
        }
      }, 800);

    } catch (err) {
      showMsg('loginError', err.message);
    } finally {
      btn.disabled = false;
      document.getElementById('loginLoading').style.display = 'none';
    }
  }

  async function handleRegister() {
    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;
    const confirm = document.getElementById('registerConfirm').value;

    if (!name || !email || !password) return showMsg('registerError', 'Vui lòng nhập đầy đủ thông tin.');
    if (password !== confirm) return showMsg('registerError', 'Mật khẩu xác nhận không khớp.');
    if (password.length < 8) return showMsg('registerError', 'Mật khẩu tối thiểu 8 ký tự.');

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    document.getElementById('registerLoading').style.display = 'block';

    try {
      await apiRegister(name, email, password);
      showMsg('registerSuccess', 'Đăng ký thành công! Vui lòng đăng nhập.', 'success');
      setTimeout(() => switchTab('login'), 1500);
    } catch (err) {
      showMsg('registerError', err.message);
    } finally {
      btn.disabled = false;
      document.getElementById('registerLoading').style.display = 'none';
    }
  }

  document.addEventListener('keypress', e => {
    if (e.key !== 'Enter') return;
    const isLogin = document.getElementById('loginForm').classList.contains('active');
    if (isLogin) handleLogin(); else handleRegister();
  });
</script>
</body>
</html>
