<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - ShopVN</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }

    /* NAV */
    nav {
      background:#fff; border-bottom:1px solid #eee;
      padding:0 2rem; display:flex; align-items:center;
      gap:1rem; height:60px; position:sticky; top:0; z-index:100;
    }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; margin-right:auto; }
    .logo span { color:#e53935; }
    .nav-btn {
      text-decoration:none; color:#111; font-size:0.875rem;
      padding:0.4rem 0.8rem; border-radius:6px; border:1px solid #ddd;
      transition:background 0.2s;
    }
    .nav-btn:hover { background:#f5f5f5; }

    /* LAYOUT */
    .main {
      max-width:1100px; margin:2rem auto; padding:0 2rem;
      display:grid; grid-template-columns:1fr 340px; gap:1.5rem;
    }
    @media(max-width:768px) {
      .main { grid-template-columns:1fr; padding:0 1rem; }
    }

    /* CARD */
    .card { background:#fff; border-radius:12px; border:1px solid #eee; padding:1.5rem; }

    /* CART HEADER */
    .cart-header {
      display:flex; align-items:center;
      justify-content:space-between; margin-bottom:1.5rem;
    }
    .cart-header h2 { font-size:1.2rem; font-weight:600; }
    .clear-all-btn {
      background:none; border:1px solid #e53935; color:#e53935;
      padding:0.35rem 0.9rem; border-radius:6px; font-size:0.8rem;
      cursor:pointer; transition:background 0.2s;
    }
    .clear-all-btn:hover { background:#fff3f3; }

    /* CART ITEM */
    .cart-item {
      display:flex; align-items:flex-start; gap:1rem;
      padding:1rem 0; border-bottom:1px solid #f0f0f0;
    }
    .cart-item:last-child { border-bottom:none; }
    .item-img {
      width:80px; height:80px; border-radius:8px;
      object-fit:cover; background:#f0f0f0; flex-shrink:0;
    }
    .item-info { flex:1; min-width:0; }
    .item-name { font-weight:500; font-size:0.95rem; margin-bottom:0.2rem; }
    .item-variant { font-size:0.8rem; color:#888; margin-bottom:0.15rem; }
    .item-stock  { font-size:0.78rem; color:#aaa; margin-bottom:0.35rem; }
    .item-price  { color:#e53935; font-weight:700; font-size:0.95rem; margin-bottom:0.5rem; }

    /* QTY CONTROLS */
    .qty-controls { display:flex; align-items:center; gap:0.4rem; }
    .qty-btn {
      width:28px; height:28px; border:1px solid #ddd;
      background:#fff; border-radius:5px; cursor:pointer;
      font-size:1rem; line-height:1; transition:background 0.15s;
      flex-shrink:0;
    }
    .qty-btn:hover { background:#f0f0f0; }
    .qty-num {
      width:48px; text-align:center; font-size:0.9rem;
      border:1px solid #ddd; border-radius:5px;
      padding:0.2rem 0.3rem; outline:none;
      -moz-appearance:textfield;
    }
    .qty-num::-webkit-inner-spin-button,
    .qty-num::-webkit-outer-spin-button { -webkit-appearance:none; }
    .remove-btn {
      margin-left:0.25rem; background:none; border:none;
      color:#bbb; cursor:pointer; font-size:0.82rem;
      padding:0.2rem 0.5rem; border-radius:4px; transition:all 0.15s;
      white-space:nowrap;
    }
    .remove-btn:hover { color:#e53935; background:#fff3f3; }

    /* ITEM TOTAL */
    .item-total {
      font-weight:700; font-size:0.95rem;
      min-width:90px; text-align:right; flex-shrink:0;
      padding-top:0.2rem;
    }

    /* SUMMARY */
    .summary-row {
      display:flex; justify-content:space-between;
      font-size:0.875rem; padding:0.5rem 0; color:#555;
    }
    .summary-row.total {
      font-weight:700; font-size:1.05rem; color:#111;
      border-top:1px solid #eee; margin-top:0.5rem; padding-top:1rem;
    }

    /* VOUCHER */
    .voucher-row { display:flex; gap:0.5rem; margin:1rem 0; }
    .voucher-input {
      flex:1; padding:0.6rem 0.8rem; border:1px solid #ddd;
      border-radius:6px; font-size:0.875rem; outline:none;
    }
    .voucher-input:focus { border-color:#111; }
    .apply-btn {
      padding:0.6rem 1rem; background:#111; color:#fff;
      border:none; border-radius:6px; font-size:0.875rem; cursor:pointer;
    }
    .apply-btn:hover { background:#333; }

    /* BUTTONS */
    .checkout-btn {
      width:100%; padding:0.9rem; background:#111; color:#fff;
      border:none; border-radius:8px; font-size:1rem;
      font-weight:600; cursor:pointer; margin-top:1rem; transition:background 0.2s;
    }
    .checkout-btn:hover { background:#333; }
    .continue-btn {
      width:100%; padding:0.7rem; background:#fff; color:#111;
      border:1px solid #ddd; border-radius:8px; font-size:0.9rem;
      cursor:pointer; margin-top:0.75rem; transition:background 0.2s;
    }
    .continue-btn:hover { background:#f5f5f5; }

    /* EMPTY */
    .empty { text-align:center; padding:3rem; color:#888; font-size:0.95rem; }
  </style>
</head>
<body>

<nav>
  <a href="/index.html" class="logo">Shop<span>VN</span></a>
  <a href="/index.html" class="nav-btn">← Tiếp tục mua sắm</a>
</nav>

<div class="main">
  <!-- Danh sách sản phẩm -->
  <div class="card">
    <div class="cart-header">
      <h2>Giỏ hàng (<span id="itemCount">0</span> sản phẩm)</h2>
      <button class="clear-all-btn" onclick="clearAllCart()">🗑 Xóa toàn bộ</button>
    </div>
    <div id="cartItems"></div>
  </div>

  <!-- Tóm tắt & thanh toán -->
  <div>
    <div class="card">
      <h2 style="margin-bottom:1rem;">Tóm tắt đơn hàng</h2>
      <div class="summary-row"><span>Tạm tính</span><span id="subtotal">0đ</span></div>
      <div class="summary-row"><span>Phí vận chuyển</span><span>Miễn phí</span></div>
      <div class="summary-row">
        <span>Giảm giá voucher</span>
        <span id="voucherDiscount" style="color:#27ae60;">-0đ</span>
      </div>
      <div class="summary-row total">
        <span>Tổng cộng</span><span id="totalAmount">0đ</span>
      </div>
      <div class="voucher-row">
        <input class="voucher-input" type="text" id="voucherCode" placeholder="Nhập mã voucher..."/>
        <button class="apply-btn" onclick="applyVoucher()">Áp dụng</button>
      </div>
      <button class="checkout-btn" onclick="goCheckout()">Tiến hành thanh toán</button>
      <button class="continue-btn" onclick="window.location.href='/index.html'">Tiếp tục mua sắm</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!guardLogin()) return;
    renderCart();
  });

  let voucherDiscount = 0;

  // ── Format attributes thành chuỗi hiển thị ───────────────
  function formatAttributes(sku, attributes) {
    const entries = Object.entries(attributes || {});

    if (entries.length === 0) {
      // Không có attributes: chỉ hiện SKU nếu không phải DEFAULT
      return (sku && sku !== 'DEFAULT') ? `SKU: ${sku}` : '';
    }

    // Có attributes: hiện dạng "Size: L | Color: Blue"
    return entries
      .map(([k, v]) => `${capitalize(k)}: ${v}`)
      .join(' | ');
  }

  function capitalize(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
  }

  // ── Render toàn bộ giỏ hàng ──────────────────────────────
  function renderCart() {
    const cart = getCart();
    document.getElementById('itemCount').textContent = cart.length;

    if (!cart.length) {
      document.getElementById('cartItems').innerHTML =
        '<div class="empty">🛒<br><br>Giỏ hàng trống.<br>Hãy thêm sản phẩm!</div>';
      updateSummary(0);
      return;
    }

    document.getElementById('cartItems').innerHTML = cart.map(item => {
      const variantLabel = formatAttributes(item.sku, item.attributes);
      const stock = item.stockQuantity || 0;

      return `
        <div class="cart-item">
          <img class="item-img"
               src="${item.imageUrl || ''}"
               alt="${item.name}"
               onerror="this.style.background='#f0f0f0'; this.removeAttribute('src')"/>

          <div class="item-info">
            <div class="item-name">${item.name}</div>
            ${variantLabel
              ? `<div class="item-variant">📦 ${variantLabel}</div>`
              : ''}
            <div class="item-stock">Tồn kho: ${stock}</div>
            <div class="item-price">${formatPrice(item.price)}</div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${item.variantId}, -1)">−</button>
              <input  class="qty-num"
                      type="number" min="1" max="${stock}"
                      value="${item.qty}"
                      onchange="inputQty(${item.variantId}, this.value)"
                      onblur="inputQty(${item.variantId}, this.value)"/>
              <button class="qty-btn" onclick="changeQty(${item.variantId}, 1)">+</button>
              <button class="remove-btn" onclick="removeItem(${item.variantId})">✕ Xóa</button>
            </div>
          </div>

          <div class="item-total">${formatPrice(item.price * item.qty)}</div>
        </div>`;
    }).join('');

    updateSummary();
  }

  // ── Cập nhật tổng tiền ────────────────────────────────────
  function updateSummary() {
    const subtotal = getCart().reduce((s, i) => s + Number(i.price) * Number(i.qty), 0);
    document.getElementById('subtotal').textContent = formatPrice(subtotal);
    document.getElementById('voucherDiscount').textContent = `-${formatPrice(voucherDiscount)}`;
    document.getElementById('totalAmount').textContent = formatPrice(subtotal - voucherDiscount);
  }

  // ── Nút +/- số lượng ─────────────────────────────────────
  function changeQty(variantId, delta) {
    const cart = getCart();
    const item = cart.find(i => i.variantId === variantId);
    if (!item) return;

    // Nút − khi đang là 1 → hỏi xóa
    if (delta === -1 && item.qty === 1) {
      if (confirm(`Xóa "${item.name}" khỏi giỏ hàng?`)) {
        deleteItemByVariantId(variantId);
        showToast('Xóa sản phẩm thành công');
      }
      return;
    }

    const newQty = item.qty + delta;
    const stock  = item.stockQuantity || 0;

    if (newQty > stock) {
      showToast('Vượt quá số lượng tồn kho', 'error');      
      return;
    }

    item.qty = Math.max(1, newQty);
    saveCart(cart);
    renderCart();
  }

  // ── Nhập tay số lượng ─────────────────────────────────────
  function inputQty(variantId, value) {
    const cart = getCart();
    const item  = cart.find(i => i.variantId === variantId);
    if (!item) return;

    let qty   = parseInt(value) || 1;
    const stock = item.stockQuantity || 0;

    if (qty < 1) qty = 1;

    if (qty > stock) {
      showToast('Vượt quá số lượng tồn kho', 'error');      
      qty = stock;
    }

    item.qty = qty;
    saveCart(cart);
    renderCart();
  }

  // ── Xóa 1 item theo variantId (không xác nhận — dùng nội bộ) ──
  function deleteItemByVariantId(variantId) {
    saveCart(getCart().filter(i => i.variantId !== variantId));
    renderCart();
  }

  // ── Nút ✕ Xóa trên mỗi dòng (có xác nhận) ───────────────
  function removeItem(variantId) {
    const item = getCart().find(i => i.variantId === variantId);
    const label = item ? `"${item.name}"` : 'sản phẩm này';
    if (confirm(`Xóa ${label} khỏi giỏ hàng?`)) {
      deleteItemByVariantId(variantId);
      showToast('Xóa sản phẩm thành công');

    }
  }

  // ── Xóa toàn bộ giỏ (dùng clearCart từ api.js, có xác nhận) ──
  function clearAllCart() {
    if (!getCart().length) {
      showToast('Giỏ hàng đang trống', 'error');
      return;
    }
    if (confirm('Xóa toàn bộ giỏ hàng?')) {
      clearCart();
      renderCart();
      showToast('Xóa toàn bộ giỏ hàng thành công');
    }
  }

  // ── Voucher ───────────────────────────────────────────────
  async function applyVoucher() {
    const code = document.getElementById('voucherCode').value.trim();
    if (!code) return showToast('Vui lòng nhập mã voucher', 'error');

    try {
      const res  = await fetch(`/api/v1/vouchers/check?code=${code}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      });
      const body = await res.json();

      if (res.ok && body.data?.discountPercent) {
        const subtotal = getCart().reduce((s, i) => s + i.price * i.qty, 0);
        voucherDiscount = subtotal * body.data.discountPercent / 100;
        localStorage.setItem('voucher', JSON.stringify({
          id: body.data.id,
          code,
          discountPercent: body.data.discountPercent
        }));
        updateSummary();
        showToast(`✓ Áp dụng voucher thành công! Giảm ${body.data.discountPercent}%`);
      } else {
        showToast('Mã voucher không hợp lệ hoặc đã hết hạn', 'error');
      }
    } catch {
      showToast('Không thể kiểm tra voucher', 'error');
    }
  }

  // ── Checkout ──────────────────────────────────────────────
  function goCheckout() {
    if (!getCart().length) return showToast('Giỏ hàng trống!', 'error');
    window.location.href = '/pages/checkout.html';
  }
</script>
</body>
</html>
