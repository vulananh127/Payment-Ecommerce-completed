<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản lý đơn hàng</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; display:flex; min-height:100vh; }
    aside { width:220px; background:#111; color:#fff; padding:1.5rem 0; flex-shrink:0; position:fixed; top:0; bottom:0; }
    .sidebar-logo { font-size:1.2rem; font-weight:700; padding:0 1.5rem 1.5rem; border-bottom:1px solid #333; }
    .sidebar-logo span { color:#e53935; }
    .menu-item { display:block; padding:0.75rem 1.5rem; color:#aaa; text-decoration:none; font-size:0.9rem; transition:all 0.2s; }
    .menu-item:hover, .menu-item.active { background:#222; color:#fff; }
    .menu-item.active { border-left:3px solid #e53935; }
    .main { margin-left:220px; flex:1; padding:2rem; }
    h1 { font-size:1.3rem; font-weight:600; margin-bottom:1.5rem; }
    .btn { padding:0.6rem 1.2rem; border-radius:8px; font-size:0.875rem; cursor:pointer; border:none; font-weight:500; transition: all 0.2s; }
    .btn-primary { background:#111; color:#fff; }
    .btn-primary:hover { background:#333; }
    .btn-danger { background:#fff3f3; color:#e53935; border:1px solid #f5c6cb; }
    .btn-danger:hover { background:#ffe0e0; }
    .btn-edit { background:#f0f4ff; color:#1565c0; border:1px solid #bbcfff; }
    .btn-edit:hover { background:#dce8ff; }
    .btn-sm { padding:0.3rem 0.7rem; font-size:0.8rem; }
    .stats { display:grid; grid-template-columns: repeat(4, 1fr) 2fr;  gap:1rem; margin-bottom:1.5rem; }
    .stat-card { background:#fff; border-radius:10px; border:1px solid #eee; padding:1.25rem; }
    .stat-label { font-size:0.8rem; color:#888; margin-bottom:0.4rem; }
    .stat-value { font-size:1.5rem; font-weight:700; }
    .stat-value.red { color:#e53935; }
    .filters { display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
    .filters input { padding:0.6rem 1rem; border:1px solid #ddd; border-radius:8px; font-size:0.875rem; outline:none; background:#fff; flex:1; min-width:200px; }
    .filter-btn { padding:0.5rem 1rem; border:1px solid #ddd; border-radius:20px; font-size:0.8rem; cursor:pointer; background:#fff; transition:all 0.2s; }
    .filter-btn.active { background:#111; color:#fff; border-color:#111; }
    .table-card { background:#fff; border-radius:12px; border:1px solid #eee; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th { background:#fafafa; padding:0.85rem 1rem; text-align:left; font-size:0.8rem; font-weight:600; color:#555; border-bottom:1px solid #eee; }
    td { padding:0.85rem 1rem; font-size:0.875rem; border-bottom:1px solid #f5f5f5; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafafa; }
    .status-badge { padding:0.25rem 0.75rem; border-radius:20px; font-size:0.75rem; font-weight:600; }
    .status-PENDING { background:#fff8e1; color:#f57f17; }
    .status-ON_DELIVERY { background:#e3f2fd; color:#1565c0; }
    .status-DELIVERED { background:#e8f5e9; color:#2e7d32; }
    .status-CANCELED { background:#fff3f3; color:#c62828; }
    .pay-badge { padding:0.2rem 0.6rem; border-radius:10px; font-size:0.75rem; }
    .pay-PAYMENT_COMPLETED { background:#e8f5e9; color:#2e7d32; }
    .pay-UNPAID { background:#fff8e1; color:#f57f17; }
    .pay-PAYMENT_FAILED { background:#fff3f3; color:#c62828; }
    .amount { font-weight:600; color:#e53935; }
    select.status-select { padding:0.3rem 0.6rem; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; outline:none; cursor:pointer; }
    .detail-btn { padding:0.35rem 0.75rem; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; cursor:pointer; background:#fff; }
    .detail-btn:hover { background:#f5f5f5; }
    .empty { text-align:center; padding:3rem; color:#888; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; border-radius:16px; padding:2rem; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .modal-title { font-size:1.1rem; font-weight:600; }
    .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem; }
    .info-item label { display:block; font-size:0.75rem; color:#888; margin-bottom:0.2rem; }
    /* ── MODAL ─────────────────────────────────────────────── */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.45); z-index:300;
      align-items:center; justify-content:center; padding:1rem;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      background:#fff; border-radius:16px; width:100%;
      max-width:640px; max-height:90vh; overflow-y:auto;
      padding:2rem; position:relative;
    }
    .modal-header {
      display:flex; justify-content:space-between;
      align-items:flex-start; margin-bottom:1.5rem;
    }
    .modal-title { font-size:1.1rem; font-weight:600; }
    .modal-sub   { font-size:0.8rem; color:#aaa; margin-top:0.2rem; }
    .close-btn {
      background:none; border:none; font-size:1.5rem;
      cursor:pointer; color:#aaa; line-height:1; padding:0;
      flex-shrink:0;
    }
    .close-btn:hover { color:#111; }

    /* Modal sections */
    .modal-section { margin-bottom:1.5rem; }
    .modal-section-title {
      font-size:0.75rem; font-weight:600; color:#888;
      text-transform:uppercase; letter-spacing:0.05em;
      margin-bottom:0.75rem;
    }
    .info-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:0.6rem 1rem;
    }
    .info-item { font-size:0.875rem; }
    .info-label { color:#888; font-size:0.78rem; margin-bottom:0.15rem; }
    .info-value { font-weight:500; }

    /* Modal order items */
    .modal-item {
      display:flex; align-items:flex-start; gap:0.75rem;
      padding:0.75rem 0; border-bottom:1px solid #f5f5f5;
    }
    .modal-item:last-child { border-bottom:none; }
    .modal-item-img {
      width:48px; height:48px; border-radius:6px;
      background:#f0f0f0; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; color:#ccc;
    }
    .modal-item-img img {
      width:48px; height:48px; border-radius:6px;
      background:#f0f0f0; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; color:#ccc;
    }
    .modal-item-info { flex:1; min-width:0; }
    .modal-item-name    { font-size:0.875rem; font-weight:500; margin-bottom:0.15rem; }
    .modal-item-variant { font-size:0.78rem; color:#888; margin-bottom:0.15rem; }
    .modal-item-qty     { font-size:0.78rem; color:#aaa; }
    .modal-item-price   { font-size:0.875rem; font-weight:600; flex-shrink:0; }

    /* Modal summary */
    .modal-summary { border-top:1px solid #eee; padding-top:1rem; }
    .modal-sum-row {
      display:flex; justify-content:space-between;
      font-size:0.875rem; padding:0.35rem 0; color:#555;
    }
    .modal-sum-row.total {
      font-weight:700; font-size:1rem; color:#111;
      border-top:1px solid #eee; margin-top:0.35rem; padding-top:0.75rem;
    }
    .modal-sum-row.total span { color:#e53935; }
  </style>
</head>
<body>
<aside>
  <div class="sidebar-logo">Shop<span>VN</span> Admin</div>
  <nav>
    <a href="/pages/admin-categories.html" class="menu-item">🗂️ Danh mục</a>
    <a href="/pages/admin-products.html" class="menu-item">📦 Sản phẩm</a>
    <a href="/pages/admin-orders.html" class="menu-item active">📋 Đơn hàng</a>
    <a href="/" class="menu-item">🏠 Trang chủ</a>
    <a href="#" class="menu-item" onclick="localStorage.clear(); window.location.href='/pages/login.html'">🚪 Đăng xuất</a>
  </nav>
</aside>

<div class="main">
  <h1>Quản lý đơn hàng</h1>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Tổng đơn hàng</div><div class="stat-value" id="totalOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Chờ xử lý</div><div class="stat-value" id="pendingOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Đang giao</div><div class="stat-value" id="deliveringOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Đã giao</div><div class="stat-value" id="deliveredOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Doanh thu</div><div class="stat-value red" id="totalRevenue">—</div></div>
  </div>
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Tìm theo mã đơn, email..." oninput="filterOrders()" />
    <button class="filter-btn active" onclick="setStatus(null, this)">Tất cả</button>
    <button class="filter-btn" onclick="setStatus('PENDING', this)">Chờ xử lý</button>
    <button class="filter-btn" onclick="setStatus('CONFIRMED', this)">Đã xác nhận</button>
    <button class="filter-btn" onclick="setStatus('ON_DELIVERY', this)">Đang giao</button>
    <button class="filter-btn" onclick="setStatus('DELIVERED', this)">Đã giao</button>
    <button class="filter-btn" onclick="setStatus('CANCELED', this)">Đã hủy</button>
  </div>

  <div style="margin-bottom:1rem;">
      <span id="orderCount" style="color:#888; font-size:0.875rem;margin-left:auto;"></span>
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr><th>#ID</th><th>Khách hàng</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày đặt</th><th>Thao tác</th></tr>
      </thead>
      <tbody id="orderTable"><tr><td colspan="7" class="empty">Đang tải...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- ── MODAL CHI TIẾT ───────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay"
     onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!--Modal updateStat--> 
<div class="modal-overlay" id="statusModal">
  <div class="modal" style="max-width:400px">

    <div class="modal-header">
      <h3 class="modal-title">Cập nhật trạng thái</h3>
      <button class="close-btn" onclick="closeStatusModal()">×</button>
    </div>

    <div style="margin-bottom:1rem">

      <label>Trạng thái</label>

      <select id="statusSelect" class="status-select"
        style="width:100%; margin-top:6px">

        <option value="PENDING">Chờ xử lý</option>
        <option value="CONFIRMED">Đã xác nhận</option>
        <option value="ON_DELIVERY">Đang giao</option>
        <option value="DELIVERED">Đã giao</option>
        <option value="CANCELED">Đã hủy</option>

      </select>

    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end">

      <button class="btn"
        onclick="closeStatusModal()">
        Hủy
      </button>

      <button class="btn btn-primary"
        onclick="saveStatus()">
        Lưu
      </button>

    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!guardAdmin()) return;
    loadOrders();
  });

  // ── Labels ────────────────────────────────────────────────
  const STATUS_LABEL = {
    PENDING:     'Chờ xử lý',
    CONFIRMED:   'Đã xác nhận',
    ON_DELIVERY: 'Đang giao',
    DELIVERED:   'Đã giao',
    CANCELED:    'Đã hủy'
  };
  const PAY_LABEL = {
    UNPAID:              'Chưa thanh toán',
    PAYMENT_PROCESSING:  'Chờ thanh toán',
    PAYMENT_COMPLETED:   'Đã thanh toán',
    PAYMENT_FAILED:      'Thanh toán lỗi'
  };
  const PAY_METHOD_LABEL = {
    COD:    'Tiền mặt (COD)',
    VNPAY:  'Ví VNPay',
    MOMO: 'Ví MOMO'
  };

  let allOrders = [];
  let statusFilter = null;
  let editingOrderId = null;

  function setStatus(status, btn) {
    statusFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterOrders();
  }

  function filterOrders() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    let filtered = statusFilter ? allOrders.filter(o => o.orderStatus === statusFilter) : allOrders;
    if (kw) filtered = filtered.filter(o =>
      String(o.id || o.orderId).includes(kw) ||
      (o.receiverName||'').toLowerCase().includes(kw) ||
      (o.email||'').toLowerCase().includes(kw)
    );
    renderTable(filtered);
  }

  function renderTable(orders) {
  const tbody = document.getElementById('orderTable');
  document.getElementById('orderCount').textContent =
    `${orders.length} đơn hàng`;
  if (!orders.length) {
    tbody.innerHTML =
      '<tr><td colspan="7" class="empty">Không có đơn hàng nào.</td></tr>';
    return;
  }

  tbody.innerHTML = orders.map(o => {
    const id = o.id || o.orderId || o.order_id;
    return `
      <tr>
        <td style="font-weight:600;">#${id}</td>
        <td>
          <div style="font-weight:500;">
            ${o.receiverName || '—'}
          </div>
          <div style="font-size:0.8rem; color:#888;">
            ${o.email || ''}
          </div>
        </td>
        <td class="amount">
          ${formatPrice(o.totalAmount)}
        </td>
        <td>
          <span class="pay-badge pay-${o.paymentStatus}">
            ${PAY_LABEL[o.paymentStatus] || o.paymentStatus || '—'} (${o.paymentMethod})
          </span>
        </td>
        <td>
          <span class="status-badge status-${o.orderStatus}">
            ${STATUS_LABEL[o.orderStatus] || o.orderStatus}
          </span>
        </td>
        <td style="color:#888; font-size:0.8rem;">
          ${formatDate(o.createdAt)}
        </td>
        <td>
          <button class="btn btn-edit btn-sm" onclick="openStatusModal(${id}, '${o.orderStatus}')">Cập nhật</button>
          <button class="btn btn-danger btn-sm" onclick="openModal(${id})">Chi tiết</button>
        </td>
      </tr>
    `;
  }).join('');
}

    function openStatusModal(id, status) {
    editingOrderId = id;
    document.getElementById("statusSelect").value = status;
    document
      .getElementById("statusModal")
      .classList.add("show");
    }
  
    function closeStatusModal() {
      editingOrderId = null;
      document
        .getElementById("statusModal")
        .classList.remove("show");
    }

    function saveStatus() {
      const status =
        document.getElementById("statusSelect").value;
      updateStatus(editingOrderId, status);
      closeStatusModal();
    }

  async function updateStatus(id, status) {
    try {
      await apiUpdateOrderStatus(id, status);
      showToast(`✓ Đã cập nhật trạng thái đơn #${id}`);
      loadOrders();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ── Modal chi tiết ────────────────────────────────────────
  function openModal(orderId) {
    const o = allOrders.find(x => (x.id || x.orderId) === orderId);
    if (!o) return;

    const items    = o.orderItems || [];
    const totalQty = items.reduce((s, i) => s + (i.quantity || 0), 0);

    // Địa chỉ
    const addrObj = o.address || {};

    const addr = [
      addrObj.address,
      addrObj.commune,
      addrObj.district,
      addrObj.province
    ].filter(Boolean).join(', ');

    // Items HTML
    const itemsHtml = items.map(item => `
      <div class="modal-item">
        <div class="modal-item-img">
          <img src="${item.imageUrl || '/images/no-image.png'}"
       alt="product">
          </div>
        <div class="modal-item-info">
          <div class="modal-item-name">${item.productName || 'Sản phẩm'}</div>
          ${item.variantName && item.variantName !== 'DEFAULT'
            ? `<div class="modal-item-variant">Phân loại: ${item.variantName}</div>` : ''}
          <div class="modal-item-qty">
            x${item.quantity} · Đơn giá: ${formatPrice(item.unitPrice)}
          </div>
        </div>
        <div class="modal-item-price">${formatPrice(item.totalPrice)}</div>
      </div>`).join('');

    const subtotal   = items.reduce((s, i) => s + (i.totalPrice || 0), 0);
    const shippingFee = o.shippingFee || 0;

    document.getElementById('modalContent').innerHTML = `
      <div class="modal-header">
        <div>
          <div class="modal-title">Chi tiết đơn hàng #${o.id || o.orderId}</div>
          <div class="modal-sub">${formatDate(o.createdAt)}</div>
        </div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>

      <!-- Trạng thái -->
      <div class="modal-section">
        <div class="modal-section-title">Trạng thái</div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <span class="status-badge status-${o.orderStatus}">
            ${STATUS_LABEL[o.orderStatus] || o.orderStatus}
          </span>
          <span class="pay-badge pay-${o.paymentStatus}" style="font-size:0.8rem; padding:0.3rem 0.8rem; border-radius:20px;">
            ${PAY_LABEL[o.paymentStatus] || ''}
          </span>
        </div>
      </div>

      <!-- Thông tin người nhận -->
      <div class="modal-section">
        <div class="modal-section-title">Thông tin giao hàng</div>
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Người nhận</div>
            <div class="info-value">${o.receiverName || '-'}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Số điện thoại</div>
            <div class="info-value">${o.phone || '-'}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Email</div>
            <div class="info-value">${o.email || '-'}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Phương thức thanh toán</div>
            <div class="info-value">${PAY_METHOD_LABEL[o.paymentMethod] || o.paymentMethod || '-'}</div>
          </div>
          <div class="info-item" style="grid-column:1/-1;">
            <div class="info-label">Địa chỉ</div>
            <div class="info-value">${addr || '-'}</div>
          </div>
          ${o.note ? `
          <div class="info-item" style="grid-column:1/-1;">
            <div class="info-label">Ghi chú</div>
            <div class="info-value">${o.note}</div>
          </div>` : ''}
        </div>
      </div>

      <!-- Sản phẩm -->
      <div class="modal-section">
        <div class="modal-section-title">Sản phẩm (${totalQty} món)</div>
        ${itemsHtml}
      </div>

      <!-- Tổng tiền -->
      <div class="modal-summary">
        <div class="modal-sum-row">
          <span>Tạm tính</span><span>${formatPrice(subtotal)}</span>
        </div>
        <div class="modal-sum-row">
          <span>Phí vận chuyển</span>
          <span>${shippingFee > 0 ? formatPrice(shippingFee) : 'Miễn phí'}</span>
        </div>
        <div class="modal-sum-row total">
          <span>Tổng cộng</span><span>${formatPrice(o.totalAmount)}</span>
        </div>
      </div>
    `;

    document.getElementById('modalOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }

  function updateStats(orders) {
    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('pendingOrders').textContent = orders.filter(o => o.orderStatus==='PENDING').length;
    document.getElementById('deliveringOrders').textContent = orders.filter(o => o.orderStatus==='ON_DELIVERY').length;
    document.getElementById('deliveredOrders').textContent = orders.filter(o => o.orderStatus==='DELIVERED').length;
    const rev = orders.filter(o => o.orderStatus==='DELIVERED').reduce((s,o) => s+o.totalAmount, 0);
    document.getElementById('totalRevenue').textContent = formatPrice(rev);
  }

  async function loadOrders() {
    try {
      allOrders = await apiGetAllOrders();
      // renderTable(allOrders);
      updateStats(allOrders);
      filterOrders();
    } catch { document.getElementById('orderTable').innerHTML = '<tr><td colspan="7" class="empty">Không thể tải đơn hàng.</td></tr>'; }
  }

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
</script>
</body>
</html>
