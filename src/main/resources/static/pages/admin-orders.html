<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản lý đơn hàng</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; display:flex; min-height:100vh; }
    aside { width:220px; background:#111; color:#fff; padding:1.5rem 0; flex-shrink:0; position:fixed; top:0; bottom:0; }
    .sidebar-logo { font-size:1.2rem; font-weight:700; padding:0 1.5rem 1.5rem; border-bottom:1px solid #333; }
    .sidebar-logo span { color:#e53935; }
    .menu-item { display:block; padding:0.75rem 1.5rem; color:#aaa; text-decoration:none; font-size:0.9rem; transition:all 0.2s; }
    .menu-item:hover, .menu-item.active { background:#222; color:#fff; }
    .menu-item.active { border-left:3px solid #e53935; }
    .main { margin-left:220px; flex:1; padding:2rem; }
    h1 { font-size:1.3rem; font-weight:600; margin-bottom:1.5rem; }
    .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:1rem; margin-bottom:1.5rem; }
    .stat-card { background:#fff; border-radius:10px; border:1px solid #eee; padding:1.25rem; }
    .stat-label { font-size:0.8rem; color:#888; margin-bottom:0.4rem; }
    .stat-value { font-size:1.5rem; font-weight:700; }
    .stat-value.red { color:#e53935; }
    .filters { display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
    .filters input { padding:0.6rem 1rem; border:1px solid #ddd; border-radius:8px; font-size:0.875rem; outline:none; background:#fff; flex:1; min-width:200px; }
    .filter-btn { padding:0.5rem 1rem; border:1px solid #ddd; border-radius:20px; font-size:0.8rem; cursor:pointer; background:#fff; transition:all 0.2s; }
    .filter-btn.active { background:#111; color:#fff; border-color:#111; }
    .table-card { background:#fff; border-radius:12px; border:1px solid #eee; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th { background:#fafafa; padding:0.85rem 1rem; text-align:left; font-size:0.8rem; font-weight:600; color:#555; border-bottom:1px solid #eee; }
    td { padding:0.85rem 1rem; font-size:0.875rem; border-bottom:1px solid #f5f5f5; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafafa; }
    .status-badge { padding:0.25rem 0.75rem; border-radius:20px; font-size:0.75rem; font-weight:600; }
    .status-PENDING { background:#fff8e1; color:#f57f17; }
    .status-ON_DELIVERY { background:#e3f2fd; color:#1565c0; }
    .status-DELIVERED { background:#e8f5e9; color:#2e7d32; }
    .status-CANCELED { background:#fff3f3; color:#c62828; }
    .pay-badge { padding:0.2rem 0.6rem; border-radius:10px; font-size:0.75rem; }
    .pay-PAYMENT_COMPLETED { background:#e8f5e9; color:#2e7d32; }
    .pay-PAYMENT_PROCESSING { background:#fff8e1; color:#f57f17; }
    .pay-PAYMENT_FAILED { background:#fff3f3; color:#c62828; }
    .amount { font-weight:600; color:#e53935; }
    select.status-select { padding:0.3rem 0.6rem; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; outline:none; cursor:pointer; }
    .detail-btn { padding:0.35rem 0.75rem; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; cursor:pointer; background:#fff; }
    .detail-btn:hover { background:#f5f5f5; }
    .empty { text-align:center; padding:3rem; color:#888; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; border-radius:16px; padding:2rem; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .modal-title { font-size:1.1rem; font-weight:600; }
    .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem; }
    .info-item label { display:block; font-size:0.75rem; color:#888; margin-bottom:0.2rem; }
  </style>
</head>
<body>
<aside>
  <div class="sidebar-logo">Shop<span>VN</span> Admin</div>
  <nav>
    <a href="/pages/admin-categories.html" class="menu-item">🗂️ Danh mục</a>
    <a href="/pages/admin-products.html" class="menu-item">📦 Sản phẩm</a>
    <a href="/pages/admin-orders.html" class="menu-item active">📋 Đơn hàng</a>
    <a href="/" class="menu-item">🏠 Trang chủ</a>
    <a href="#" class="menu-item" onclick="localStorage.clear(); window.location.href='/pages/login.html'">🚪 Đăng xuất</a>
  </nav>
</aside>

<div class="main">
  <h1>Quản lý đơn hàng</h1>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Tổng đơn hàng</div><div class="stat-value" id="totalOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Chờ xử lý</div><div class="stat-value" id="pendingOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Đang giao</div><div class="stat-value" id="deliveringOrders">—</div></div>
    <div class="stat-card"><div class="stat-label">Doanh thu</div><div class="stat-value red" id="totalRevenue">—</div></div>
  </div>
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Tìm theo tên, email, ID..." oninput="filterOrders()" />
    <button class="filter-btn active" onclick="setStatus(null, this)">Tất cả</button>
    <button class="filter-btn" onclick="setStatus('PENDING', this)">Chờ xử lý</button>
    <button class="filter-btn" onclick="setStatus('ON_DELIVERY', this)">Đang giao</button>
    <button class="filter-btn" onclick="setStatus('DELIVERED', this)">Đã giao</button>
    <button class="filter-btn" onclick="setStatus('CANCELED', this)">Đã hủy</button>
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr><th>#ID</th><th>Khách hàng</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày đặt</th><th>Chi tiết</th></tr>
      </thead>
      <tbody id="orderTable"><tr><td colspan="7" class="empty">Đang tải...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Chi tiết đơn hàng</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="info-grid" id="orderInfo"></div>
    <h4 style="font-size:0.95rem; margin-bottom:0.75rem;">Sản phẩm</h4>
    <div id="orderItems"></div>
    <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid #eee; display:flex; justify-content:space-between;">
      <span style="font-weight:600;">Tổng cộng</span>
      <span style="font-weight:700; font-size:1.1rem; color:#e53935;" id="modalTotal"></span>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!guardAdmin()) return;
    loadOrders();
  });

  let allOrders = [];
  let statusFilter = null;
  const statusLabel = { PENDING:'Chờ xử lý', ON_DELIVERY:'Đang giao', DELIVERED:'Đã giao', CANCELED:'Đã hủy' };
  const payLabel = { PAYMENT_COMPLETED:'Đã TT', PAYMENT_PROCESSING:'Chờ TT', PAYMENT_FAILED:'TT lỗi' };

  function setStatus(status, btn) {
    statusFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterOrders();
  }

  function filterOrders() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    let filtered = statusFilter ? allOrders.filter(o => o.orderStatus === statusFilter) : allOrders;
    if (kw) filtered = filtered.filter(o =>
      String(o.id).includes(kw) ||
      (o.receiverName||'').toLowerCase().includes(kw) ||
      (o.email||'').toLowerCase().includes(kw)
    );
    renderTable(filtered);
  }

  function renderTable(orders) {
    const tbody = document.getElementById('orderTable');
    if (!orders.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">Không có đơn hàng nào.</td></tr>'; return; }
    tbody.innerHTML = orders.map(o => `
      <tr>
        <td style="font-weight:600;">#${o.id}</td>
        <td>
          <div style="font-weight:500;">${o.receiverName||'—'}</div>
          <div style="font-size:0.8rem; color:#888;">${o.email||''}</div>
        </td>
        <td class="amount">${formatPrice(o.totalAmount)}</td>
        <td><span class="pay-badge pay-${o.paymentStatus}">${payLabel[o.paymentStatus]||'—'}</span></td>
        <td>
          <select class="status-select" onchange="updateStatus(${o.id}, this.value)">
            ${['PENDING','ON_DELIVERY','DELIVERED','CANCELED'].map(s =>
              `<option value="${s}" ${o.orderStatus===s?'selected':''}>${statusLabel[s]}</option>`
            ).join('')}
          </select>
        </td>
        <td style="color:#888; font-size:0.8rem;">${formatDate(o.createdAt)}</td>
        <td><button class="detail-btn" onclick="viewDetail(${o.id})">Chi tiết</button></td>
      </tr>`).join('');
  }

  async function updateStatus(id, status) {
    try {
      await apiUpdateOrderStatus(id, status);
      showToast(`✓ Đã cập nhật trạng thái đơn #${id}`);
      loadOrders();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function viewDetail(id) {
    const o = allOrders.find(x => x.id === id);
    if (!o) return;
    document.getElementById('modalTitle').textContent = `Chi tiết đơn hàng #${o.id}`;
    document.getElementById('orderInfo').innerHTML = `
      <div class="info-item"><label>Người nhận</label><span>${o.receiverName||'—'}</span></div>
      <div class="info-item"><label>Điện thoại</label><span>${o.phone||'—'}</span></div>
      <div class="info-item"><label>Email</label><span>${o.email||'—'}</span></div>
      <div class="info-item"><label>Phương thức TT</label><span>${o.paymentMethod||'—'}</span></div>
      <div class="info-item" style="grid-column:1/-1;"><label>Địa chỉ</label><span>${[o.address,o.commune,o.district,o.province].filter(Boolean).join(', ')}</span></div>
      ${o.note ? `<div class="info-item" style="grid-column:1/-1;"><label>Ghi chú</label><span>${o.note}</span></div>` : ''}
    `;
    document.getElementById('orderItems').innerHTML = (o.orderItems||[]).map(item => `
      <div style="display:flex; align-items:center; gap:0.75rem; padding:0.6rem 0; border-bottom:1px solid #f5f5f5;">
        <div style="flex:1; font-size:0.875rem;">${item.productVariant?.product?.name||'Sản phẩm'}</div>
        <div style="font-size:0.8rem; color:#888;">x${item.quantity}</div>
        <div style="font-weight:600; font-size:0.875rem;">${formatPrice(item.totalPrice)}</div>
      </div>`).join('') || '<p style="color:#888; font-size:0.875rem;">Không có thông tin sản phẩm</p>';
    document.getElementById('modalTotal').textContent = formatPrice(o.totalAmount);
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

  function updateStats(orders) {
    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('pendingOrders').textContent = orders.filter(o => o.orderStatus==='PENDING').length;
    document.getElementById('deliveringOrders').textContent = orders.filter(o => o.orderStatus==='ON_DELIVERY').length;
    const rev = orders.filter(o => o.orderStatus==='DELIVERED').reduce((s,o) => s+o.totalAmount, 0);
    document.getElementById('totalRevenue').textContent = formatPrice(rev);
  }

  async function loadOrders() {
    try {
      allOrders = await apiGetAllOrders();
      // renderTable(allOrders);
      updateStats(allOrders);
      filterOrders();
    } catch { document.getElementById('orderTable').innerHTML = '<tr><td colspan="7" class="empty">Không thể tải đơn hàng.</td></tr>'; }
  }

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
</script>
</body>
</html>
