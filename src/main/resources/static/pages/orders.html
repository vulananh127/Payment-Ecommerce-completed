<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi - ShopVLA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }
    nav { background:#fff; border-bottom:1px solid #eee; padding:0 2rem; display:flex; align-items:center; gap:1rem; height:60px; }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; margin-right:auto; }
    .logo span { color:#e53935; }
    .nav-btn { text-decoration:none; color:#111; font-size:0.875rem; padding:0.4rem 0.8rem; border-radius:6px; border:1px solid #ddd; }
    .main { max-width:900px; margin:2rem auto; padding:0 2rem; }
    h1 { font-size:1.4rem; font-weight:600; margin-bottom:1.5rem; }
    .tabs { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .tab { padding:0.5rem 1rem; border:1px solid #ddd; border-radius:20px; font-size:0.875rem; cursor:pointer; background:#fff; transition:all 0.2s; }
    .tab.active { background:#111; color:#fff; border-color:#111; }
    .order-card { background:#fff; border-radius:12px; border:1px solid #eee; padding:1.25rem; margin-bottom:1rem; }
    .order-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
    .order-id { font-size:0.875rem; color:#888; }
    .order-date { font-size:0.8rem; color:#aaa; }
    .status-badge { padding:0.3rem 0.8rem; border-radius:20px; font-size:0.8rem; font-weight:600; }
    .status-PENDING { background:#fff8e1; color:#f57f17; }
    .status-ON_DELIVERY { background:#e3f2fd; color:#1565c0; }
    .status-DELIVERED { background:#e8f5e9; color:#2e7d32; }
    .status-CANCELED { background:#fff3f3; color:#c62828; }
    .pay-badge { font-size:0.75rem; padding:0.2rem 0.6rem; border-radius:10px; margin-left:0.5rem; }
    .pay-PAYMENT_COMPLETED { background:#e8f5e9; color:#2e7d32; }
    .pay-PAYMENT_PROCESSING { background:#fff8e1; color:#f57f17; }
    .pay-PAYMENT_FAILED { background:#fff3f3; color:#c62828; }
    .order-items { border-top:1px solid #f0f0f0; padding-top:1rem; }
    .order-item { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0; }
    .order-footer { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #f0f0f0; padding-top:1rem; margin-top:0.75rem; flex-wrap:wrap; gap:0.5rem; }
    .order-total { font-weight:700; }
    .order-total span { color:#e53935; }
    .action-btn { padding:0.4rem 1rem; border:1px solid #ddd; border-radius:6px; font-size:0.85rem; cursor:pointer; background:#fff; }
    .action-btn:hover { background:#f5f5f5; }
    .cancel-btn { color:#e53935; border-color:#e53935; }
    .cancel-btn:hover { background:#fff3f3; }
    .retry-btn { color:#1565c0; border-color:#1565c0; }
    .retry-btn:hover { background:#e3f2fd; }
    .empty { text-align:center; padding:4rem; color:#888; }
    .loading { text-align:center; padding:3rem; color:#888; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">Shop<span>VLA</span></a>
  <span id="userName" style="font-size:0.875rem; color:#555;"></span>
  <a href="/" class="nav-btn">← Tiếp tục mua sắm</a>
  <a href="#" class="nav-btn" id="logoutBtn" style="color:#e53935; border-color:#e53935;">Đăng xuất</a>
</nav>

<div class="main">
  <h1>Đơn hàng của tôi</h1>
  <div class="tabs">
    <button class="tab active" onclick="filterOrders(null, this)">Tất cả</button>
    <button class="tab" onclick="filterOrders('PENDING', this)">Chờ xử lý</button>
    <button class="tab" onclick="filterOrders('ON_DELIVERY', this)">Đang giao</button>
    <button class="tab" onclick="filterOrders('DELIVERED', this)">Đã giao</button>
    <button class="tab" onclick="filterOrders('CANCELED', this)">Đã hủy</button>
  </div>
  <div id="orderList"><div class="loading">Đang tải đơn hàng...</div></div>
</div>

<script src="/js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {

  if (!guardLogin()) return;

  const params = new URLSearchParams(window.location.search);
  const status = params.get("status");

  if (status === "success") {
    showToast("Thanh toán thành công");
  }

  if (status === "fail") {
    showToast("Thanh toán thất bại", "error");
  }

  if (status) {
    window.history.replaceState({}, document.title, "/pages/orders.html");
  }

  loadOrders();
});

  let allOrders = [];
  const statusLabel = { PENDING:'Chờ xử lý', ON_DELIVERY:'Đang giao', DELIVERED:'Đã giao', CANCELED:'Đã hủy' };
  const payLabel = { PAYMENT_COMPLETED:'Đã TT', PAYMENT_PROCESSING:'Chờ TT', PAYMENT_FAILED:'TT thất bại' };

  function filterOrders(status, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderOrders(status ? allOrders.filter(o => o.orderStatus === status) : allOrders);
  }

  function renderOrders(orders) {
    const container = document.getElementById('orderList');
    if (!orders.length) {
      container.innerHTML = '<div class="empty">📋<br><br>Không có đơn hàng nào.</div>'; return;
    }
    container.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <div>
            <span class="order-id">Đơn hàng #${o.id}</span>
            <span class="pay-badge pay-${o.paymentStatus}">${payLabel[o.paymentStatus] || ''}</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span class="order-date">${formatDate(o.createdAt)}</span>
            <span class="status-badge status-${o.orderStatus}">${statusLabel[o.orderStatus] || o.orderStatus}</span>
          </div>
        </div>
        <div class="order-items">
          ${(o.orderItems || []).map(item => `
            <div class="order-item">
              <div style="flex:1; font-size:0.875rem;">${item.productVariant?.product?.name || 'Sản phẩm'}</div>
              <span style="font-size:0.8rem; color:#888;">x${item.quantity}</span>
              <span style="font-weight:600; font-size:0.875rem;">${formatPrice(item.totalPrice)}</span>
            </div>`).join('')}
        </div>
        <div class="order-footer">
          <div class="order-total">Tổng: <span>${formatPrice(o.totalAmount)}</span></div>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            ${o.paymentStatus === 'PAYMENT_FAILED' ? `<button class="action-btn retry-btn" onclick="retryPayment(${o.id}, ${o.totalAmount}, '${o.paymentMethod}')">Thanh toán lại</button>` : ''}
            ${o.orderStatus === 'PENDING' ? `<button class="action-btn cancel-btn" onclick="cancelOrder(${o.id})">Hủy đơn</button>` : ''}
          </div>
        </div>
      </div>`).join('');
  }

  async function cancelOrder(id) {
    if (!confirm('Bạn có chắc muốn hủy đơn hàng này?')) return;
    try {
      await apiCancelOrder(id);
      showToast('✓ Đã hủy đơn hàng');
      loadOrders();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // async function retryPayment(orderId, amount, method) {
  //   try {
  //     const data = await apiCreatePayment({ orderId, paymentMethod: method, amount });
  //     if (data.paymentUrl) window.location.href = data.paymentUrl;
  //     else showToast('Không thể tạo link thanh toán', 'error');
  //   } catch (err) {
  //     showToast(err.message, 'error');
  //   }
  // }

  async function retryPayment(orderId, amount, method) {
    try {
      const data = await apiCreatePayment({
        orderId: orderId,
        paymentMethod: method,
        totalAmount: amount     
      });
      if (data.paymentUrl) window.location.href = data.paymentUrl;
      else showToast('Không thể tạo link thanh toán', 'error');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadOrders() {
    try {
      allOrders = await apiGetMyOrders();
      renderOrders(allOrders);
    } catch (err) {
      document.getElementById('orderList').innerHTML = '<div class="empty">Không thể tải đơn hàng.</div>';
    }
  }
</script>
</body>
</html>
