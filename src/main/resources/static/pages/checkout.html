<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - ShopVLA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }

    nav {
      background:#fff; border-bottom:1px solid #eee;
      padding:0 2rem; display:flex; align-items:center; height:60px;
      position:sticky; top:0; z-index:100;
    }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; }
    .logo span { color:#e53935; }

    .main {
      max-width:1100px; margin:2rem auto; padding:0 2rem;
      display:grid; grid-template-columns:1fr 360px; gap:1.5rem;
      align-items:start;
    }
    @media(max-width:768px) {
      .main { grid-template-columns:1fr; padding:0 1rem; }
    }

    .card {
      background:#fff; border-radius:12px;
      border:1px solid #eee; padding:1.5rem; margin-bottom:1.25rem;
    }
    h2 { font-size:1.1rem; font-weight:600; margin-bottom:1.25rem; }

    /* FORM */
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-group { margin-bottom:1rem; }
    label {
      display:block; font-size:0.8rem; font-weight:500;
      color:#555; margin-bottom:0.35rem;
    }
    input, select, textarea {
      width:100%; padding:0.65rem 0.9rem;
      border:1px solid #ddd; border-radius:8px;
      font-size:0.9rem; outline:none; font-family:inherit;
      background:#fff; color:#111;
      transition:border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color:#111; }
    select:disabled { background:#f5f5f5; color:#aaa; cursor:not-allowed; }
    textarea { resize:vertical; min-height:80px; }
    .select-loading { position:relative; }
    .select-loading::after {
      content:''; position:absolute; right:12px; top:50%;
      transform:translateY(-50%);
      width:14px; height:14px;
      border:2px solid #ddd; border-top-color:#111;
      border-radius:50%; animation:spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform:translateY(-50%) rotate(360deg); } }

    /* PAYMENT */
    .payment-methods {
      display:grid; grid-template-columns:1fr 1fr;
      gap:0.75rem;
    }
    .payment-option {
      border:2px solid #eee; border-radius:10px;
      padding:1rem 0.75rem; text-align:center;
      cursor:pointer; transition:all 0.2s;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:0.35rem;
    }
    .payment-option:hover { border-color:#bbb; }
    .payment-option.selected { border-color:#111; background:#f9f9f9; }
    .payment-icon { font-size:1.6rem; line-height:1; }
    .payment-name { font-size:0.82rem; font-weight:500; }

    /* ORDER SUMMARY */
    .order-item {
      display:flex; align-items:flex-start;
      gap:0.75rem; padding:0.75rem 0;
      border-bottom:1px solid #f0f0f0;
    }
    .order-item:last-child { border-bottom:none; }
    .order-img {
      width:56px; height:56px; border-radius:6px;
      object-fit:cover; background:#f0f0f0; flex-shrink:0;
    }
    .order-item-info { flex:1; min-width:0; }
    .order-name { font-size:0.875rem; font-weight:500; margin-bottom:0.15rem; }
    .order-variant { font-size:0.78rem; color:#888; margin-bottom:0.15rem; }
    .order-qty { font-size:0.8rem; color:#aaa; }
    .order-price { font-weight:600; font-size:0.875rem; flex-shrink:0; }

    .summary-row {
      display:flex; justify-content:space-between;
      font-size:0.875rem; padding:0.4rem 0; color:#555;
    }
    .summary-row.total {
      font-weight:700; font-size:1.05rem; color:#111;
      border-top:1px solid #eee; margin-top:0.5rem; padding-top:0.75rem;
    }

    .place-btn {
      width:100%; padding:0.9rem; background:#111; color:#fff;
      border:none; border-radius:8px; font-size:1rem;
      font-weight:600; cursor:pointer; margin-top:1rem;
      transition:background 0.2s;
    }
    .place-btn:hover { background:#333; }
    .place-btn:disabled { background:#aaa; cursor:not-allowed; }

    .voucher-info {
      font-size:0.8rem; color:#27ae60;
      margin-top:0.25rem; display:none;
    }
  </style>
</head>
<body>
<nav>
  <a href="/index.html" class="logo">Shop<span>VLA</span></a>
</nav>

<div class="main">
  <div>
    <!-- Thông tin giao hàng -->
    <div class="card">
      <h2>Thông tin giao hàng</h2>

      <div class="form-row">
        <div class="form-group">
          <label>Họ và tên người nhận *</label>
          <input type="text" id="receiverName" placeholder="Nguyễn Văn A"/>
        </div>
        <div class="form-group">
          <label>Số điện thoại *</label>
          <input type="tel" id="phone" placeholder="0901234567"/>
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="example@gmail.com"/>
      </div>

      <!-- Địa chỉ: 3 select cascade -->
      <div class="form-row">
        <div class="form-group">
          <label>Tỉnh / Thành phố *</label>
          <select id="provinceSelect" onchange="onProvinceChange()">
            <option value="">-- Đang tải... --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quận / Huyện *</label>
          <select id="districtSelect" onchange="onDistrictChange()" disabled>
            <option value="">-- Chọn tỉnh trước --</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Phường / Xã *</label>
          <select id="wardSelect" disabled>
            <option value="">-- Chọn quận trước --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Địa chỉ cụ thể *</label>
          <input type="text" id="address" placeholder="Số nhà, ngõ, đường..."/>
        </div>
      </div>

      <div class="form-group">
        <label>Ghi chú</label>
        <textarea id="note" placeholder="Giao giờ hành chính, gọi trước khi giao..."></textarea>
      </div>
    </div>

    <!-- Phương thức thanh toán -->
    <div class="card">
      <h2>Phương thức thanh toán</h2>
      <div class="payment-methods">
        <div class="payment-option selected" onclick="selectPayment('COD', this)">
          <div class="payment-icon">💵</div>
          <div class="payment-name">Tiền mặt (COD)</div>
        </div>
        <div class="payment-option" onclick="selectPayment('VNPAY', this)">
          <div class="payment-icon">🏦</div>
          <div class="payment-name">VNPay</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tóm tắt đơn hàng -->
  <div>
    <div class="card">
      <h2>Đơn hàng của bạn</h2>
      <div id="orderItems"></div>

      <div style="margin-top:1rem;">
        <div class="summary-row"><span>Tạm tính</span><span id="subtotal">0đ</span></div>
        <div class="summary-row"><span>Phí vận chuyển</span><span>Miễn phí</span></div>
        <div class="summary-row" id="voucherRow" style="display:none;">
          <span>Giảm giá voucher</span>
          <span id="voucherDiscount" style="color:#27ae60;">-0đ</span>
        </div>
        <div class="summary-row total"><span>Tổng cộng</span><span id="totalAmount">0đ</span></div>
      </div>

      <button class="place-btn" id="placeBtn" onclick="placeOrder()">Đặt hàng</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const GEO_API = 'https://provinces.open-api.vn/api';

  document.addEventListener('DOMContentLoaded', async () => {
    if (!guardLogin()) return;

    const cart = getCart();
    if (!cart.length) { window.location.href = '/pages/cart.html'; return; }

    // Điền sẵn thông tin user
    const user = getUser();
    if (user?.email) document.getElementById('email').value = user.email;
    if (user?.name)  document.getElementById('receiverName').value = user.name;

    renderOrder();
    await loadProvinces();
  });

  let selectedPayment = 'COD';

  // ── Format attributes (giống cart.html) ──────────────────
  function formatAttributes(sku, attributes) {
    const entries = Object.entries(attributes || {});
    if (entries.length === 0) {
      return (sku && sku !== 'DEFAULT') ? `SKU: ${sku}` : '';
    }
    return entries
      .map(([k, v]) => `${capitalize(k)}: ${v}`)
      .join(' | ');
  }
  function capitalize(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
  }

  // ── Render danh sách sản phẩm bên phải ───────────────────
  function renderOrder() {
    const cart    = getCart();
    const voucher = JSON.parse(localStorage.getItem('voucher') || 'null');

    document.getElementById('orderItems').innerHTML = cart.map(item => {
      const variantLabel = formatAttributes(item.sku, item.attributes);
      return `
        <div class="order-item">
          <img class="order-img"
               src="${item.imageUrl || ''}" alt="${item.name}"
               onerror="this.style.background='#f0f0f0';this.removeAttribute('src')"/>
          <div class="order-item-info">
            <div class="order-name">${item.name}</div>
            ${variantLabel ? `<div class="order-variant">📦 ${variantLabel}</div>` : ''}
            <div class="order-qty">x${item.qty} · ${formatPrice(item.price)}</div>
          </div>
          <div class="order-price">${formatPrice(item.price * item.qty)}</div>
        </div>`;
    }).join('');

    const subtotal = getCartTotal();

    // Voucher
    let discount = 0;
    if (voucher?.discountPercent) {
      discount = subtotal * voucher.discountPercent / 100;
      document.getElementById('voucherRow').style.display = 'flex';
      document.getElementById('voucherDiscount').textContent =
        `-${formatPrice(discount)} (${voucher.discountPercent}%)`;
    }

    document.getElementById('subtotal').textContent    = formatPrice(subtotal);
    document.getElementById('totalAmount').textContent = formatPrice(subtotal - discount);
  }

  // ── Địa chỉ: cascade select ───────────────────────────────
  async function loadProvinces() {
    const sel = document.getElementById('provinceSelect');
    setLoading(sel, true);
    try {
      const res  = await fetch(`${GEO_API}/?depth=1`);
      const data = await res.json();
      sel.innerHTML = '<option value="">-- Chọn tỉnh / thành phố --</option>';
      data.forEach(p => {
        const opt = document.createElement('option');
        opt.value       = p.code;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    } catch {
      sel.innerHTML = '<option value="">Không tải được dữ liệu</option>';
    } finally {
      setLoading(sel, false);
    }
  }

  async function onProvinceChange() {
    const code    = document.getElementById('provinceSelect').value;
    const distSel = document.getElementById('districtSelect');
    const wardSel = document.getElementById('wardSelect');

    // Reset quận & xã
    distSel.innerHTML = '<option value="">-- Chọn quận / huyện --</option>';
    wardSel.innerHTML = '<option value="">-- Chọn phường / xã --</option>';
    wardSel.disabled  = true;

    if (!code) { distSel.disabled = true; return; }

    setLoading(distSel, true);
    distSel.disabled = true;

    try {
      const res  = await fetch(`${GEO_API}/p/${code}?depth=2`);
      const data = await res.json();
      distSel.innerHTML = '<option value="">-- Chọn quận / huyện --</option>';
      (data.districts || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value       = d.code;
        opt.textContent = d.name;
        distSel.appendChild(opt);
      });
      distSel.disabled = false;
    } catch {
      distSel.innerHTML = '<option value="">Không tải được dữ liệu</option>';
    } finally {
      setLoading(distSel, false);
    }
  }

  async function onDistrictChange() {
    const code    = document.getElementById('districtSelect').value;
    const wardSel = document.getElementById('wardSelect');

    wardSel.innerHTML = '<option value="">-- Chọn phường / xã --</option>';
    wardSel.disabled  = true;

    if (!code) return;

    setLoading(wardSel, true);

    try {
      const res  = await fetch(`${GEO_API}/d/${code}?depth=2`);
      const data = await res.json();
      wardSel.innerHTML = '<option value="">-- Chọn phường / xã --</option>';
      (data.wards || []).forEach(w => {
        const opt = document.createElement('option');
        opt.value       = w.code;
        opt.textContent = w.name;
        wardSel.appendChild(opt);
      });
      wardSel.disabled = false;
    } catch {
      wardSel.innerHTML = '<option value="">Không tải được dữ liệu</option>';
    } finally {
      setLoading(wardSel, false);
    }
  }

  // Thêm class loading spinner vào wrapper của select
  function setLoading(selectEl, on) {
    const wrap = selectEl.parentElement;
    if (on) wrap.classList.add('select-loading');
    else    wrap.classList.remove('select-loading');
  }

  // ── Phương thức thanh toán ────────────────────────────────
  function selectPayment(method, el) {
    selectedPayment = method;
    document.querySelectorAll('.payment-option')
      .forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
  }

  // ── Lấy text từ select (để gửi lên API) ──────────────────
  function getSelectText(id) {
    const sel = document.getElementById(id);
    return sel.options[sel.selectedIndex]?.text || '';
  }

  // ── Đặt hàng ─────────────────────────────────────────────
  async function placeOrder() {
    // Validate form
    const requiredInputs = ['receiverName','phone','email','address'];
    const formData = {};

    for (const f of requiredInputs) {
      formData[f] = document.getElementById(f).value.trim();
      if (!formData[f]) {
        showToast('Vui lòng điền đầy đủ thông tin giao hàng', 'error');
        document.getElementById(f).focus();
        return;
      }
    }

    // Validate select địa chỉ
    const provinceText = getSelectText('provinceSelect');
    const districtText = getSelectText('districtSelect');
    const wardText     = getSelectText('wardSelect');

    if (!document.getElementById('provinceSelect').value) {
      showToast('Vui lòng chọn Tỉnh / Thành phố', 'error'); return;
    }
    if (!document.getElementById('districtSelect').value) {
      showToast('Vui lòng chọn Quận / Huyện', 'error'); return;
    }
    if (!document.getElementById('wardSelect').value) {
      showToast('Vui lòng chọn Phường / Xã', 'error'); return;
    }

    formData.province = provinceText;
    formData.district = districtText;
    formData.commune  = wardText;
    formData.note     = document.getElementById('note').value.trim();

    const btn = document.getElementById('placeBtn');
    btn.disabled    = true;
    btn.textContent = 'Đang đặt hàng...';

    try {
      const orderBody = buildOrderBody(formData, selectedPayment);
      const data      = await apiCreateOrder(orderBody);

      if ((selectedPayment === 'VNPAY' || selectedPayment === 'STRIPE') && data) {
        try {
          const paymentData = await apiCreatePayment({
            orderId: data.orderId || data.id,
            paymentMethod: selectedPayment,
            totalAmount: getCartTotal()
          });
          const redirectUrl = paymentData.vnpUrl || paymentData.paymentUrl || paymentData.url;
          if (redirectUrl) {
            clearCart();
            window.location.href = redirectUrl;
            return;
          } else {
            showToast('Không nhận được link thanh toán', 'error');
          }
        } catch (payErr) {
          showToast('Không thể tạo link thanh toán: ' + payErr.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Đặt hàng';
          return;
        }
      }

      clearCart();
      showToast('✓ Đặt hàng thành công!');
      setTimeout(() => window.location.href = '/pages/orders.html', 1200);
    } catch (err) {
      showToast('Lỗi: ' + err.message, 'error');
      btn.disabled    = false;
      btn.textContent = 'Đặt hàng';
    }
  }
</script>
</body>
</html>
