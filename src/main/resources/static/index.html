<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVN - Trang chủ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }
    nav { background:#fff; border-bottom:1px solid #eee; padding:0 2rem; display:flex; align-items:center; gap:1rem; height:60px; position:sticky; top:0; z-index:100; }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; margin-right:auto; }
    .logo span { color:#e53935; }
    .search-bar { display:flex; align-items:center; border:1px solid #ddd; border-radius:8px; overflow:hidden; width:340px; }
    .search-bar input { border:none; outline:none; padding:0.5rem 1rem; font-size:0.9rem; width:100%; }
    .search-bar button { background:#111; color:#fff; border:none; padding:0.5rem 1rem; cursor:pointer; font-size:0.9rem; }
    .nav-actions { display:flex; align-items:center; gap:0.75rem; }
    .nav-btn { text-decoration:none; color:#111; font-size:0.875rem; padding:0.4rem 0.8rem; border-radius:6px; border:1px solid #ddd; transition:background 0.2s; white-space:nowrap; }
    .nav-btn:hover { background:#f5f5f5; }
    .nav-btn-danger { color:#e53935; border-color:#e53935; }
    .nav-btn-danger:hover { background:#fff3f3; }
    .cart-wrap { position:relative; }
    .cart-badge { position:absolute; top:-6px; right:-6px; background:#e53935; color:#fff; border-radius:50%; width:18px; height:18px; font-size:11px; display:flex; align-items:center; justify-content:center; }
    .user-name { font-size:0.875rem; color:#555; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .hero { background:#111; color:#fff; padding:3rem 2rem; text-align:center; }
    .hero h1 { font-size:2rem; font-weight:700; margin-bottom:0.5rem; }
    .hero p { color:#aaa; }
    .main { max-width:1200px; margin:0 auto; padding:2rem; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .section-title { font-size:1.2rem; font-weight:600; }
    .filters { display:flex; gap:0.75rem; margin-bottom:2rem; flex-wrap:wrap; }
    .filter-btn { padding:0.4rem 1rem; border:1px solid #ddd; border-radius:20px; background:#fff; font-size:0.875rem; cursor:pointer; transition:all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background:#111; color:#fff; border-color:#111; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1.25rem; }
    .product-card { background:#fff; border-radius:12px; border:1px solid #eee; overflow:hidden; transition:transform 0.2s, box-shadow 0.2s; cursor:pointer; }
    .product-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.08); }
    .product-img { width:100%; height:200px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:0.85rem; overflow:hidden; }
    .product-img img { width:100%; height:100%; object-fit:cover; }
    .product-info { padding:1rem; }
    .product-name { font-size:0.95rem; font-weight:500; margin-bottom:0.25rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .product-category { font-size:0.8rem; color:#888; margin-bottom:0.5rem; }
    .product-price { font-size:1.1rem; font-weight:700; color:#e53935; }
    .original { font-size:0.85rem; color:#aaa; text-decoration:line-through; margin-left:0.5rem; font-weight:400; }
    .product-footer { display:flex; align-items:center; justify-content:space-between; margin-top:0.75rem; }
    .discount-badge { background:#fff3f3; color:#e53935; font-size:0.75rem; padding:0.2rem 0.5rem; border-radius:4px; font-weight:600; }
    .add-cart-btn { background:#111; color:#fff; border:none; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.8rem; cursor:pointer; }
    .add-cart-btn:hover { background:#333; }
    .empty { text-align:center; padding:3rem; color:#888; }
    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; border-radius:16px; padding:2rem; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .modal-title { font-size:1.2rem; font-weight:600; }
    .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888; }
    .modal-img { width:100%; height:280px; object-fit:cover; border-radius:10px; background:#f0f0f0; margin-bottom:1.5rem; }
    .modal-price { font-size:1.5rem; font-weight:700; color:#e53935; margin-bottom:0.5rem; }
    .modal-desc { font-size:0.9rem; color:#555; line-height:1.6; margin-bottom:1.5rem; }
    .quantity-row { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; }
    .qty-btn { width:32px; height:32px; border:1px solid #ddd; background:#fff; border-radius:6px; font-size:1.1rem; cursor:pointer; }
    .qty-input { width:60px; text-align:center; border:1px solid #ddd; border-radius:6px; padding:0.3rem; font-size:1rem; outline:none; }
    .modal-add-btn { width:100%; padding:0.85rem; background:#111; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
    .modal-add-btn:hover { background:#333; }
  </style>
</head>
<body>

<nav>
  <a href="/index.html" class="logo">Shop<span>VN</span></a>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm..."
           onkeypress="if(event.key==='Enter') filterProducts()" />
    <button onclick="filterProducts()">Tìm</button>
  </div>

  <div class="nav-actions">
    <!-- Cart luôn hiển thị -->
    <div class="cart-wrap">
      <a href="/pages/cart.html" class="nav-btn">🛒 Giỏ hàng</a>
      <span class="cart-badge" id="cartBadge">0</span>
    </div>

    <!-- Nav động theo trạng thái đăng nhập — render bằng JS -->
    <div id="navAuth"></div>
  </div>
</nav>

<div class="hero">
  <h1>Chào mừng đến ShopVN</h1>
  <p>Khám phá hàng ngàn sản phẩm chất lượng với giá tốt nhất</p>
</div>

<div class="main">
  <div class="section-header">
    <h2 class="section-title">Tất cả sản phẩm</h2>
    <span id="productCount" style="color:#888; font-size:0.875rem;"></span>
  </div>
  <div class="filters" id="categoryFilters">
    <button class="filter-btn active" onclick="selectCategory(null, this)">Tất cả</button>
  </div>
  <div class="product-grid" id="productGrid">
    <div class="empty">Đang tải sản phẩm...</div>
  </div>
</div>

<!-- Modal chi tiết sản phẩm -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalName"></h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <img class="modal-img" id="modalImg" src="" alt="" />
    <div class="modal-price" id="modalPrice"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="quantity-row">
      <span style="font-size:0.9rem;color:#555;">Số lượng:</span>
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <input class="qty-input" type="number" id="modalQty" value="1" min="1" />
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <button class="modal-add-btn" onclick="addToCartFromModal()">Thêm vào giỏ hàng</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let allProducts = [];
  let currentProduct = null;
  let selectedCategory = null;

  // -------------------------------------------------------
  // Render nav động theo trạng thái login
  // Không dùng id="logoutBtn" để tránh xung đột với api.js
  // -------------------------------------------------------
  function renderNav() {
    const navAuth = document.getElementById('navAuth');
    const user = getUser();

    if (isLoggedIn() && user) {
      navAuth.innerHTML = `
        <span class="user-name">Xin chào, ${user.name || user.email}</span>
        <a href="/pages/orders.html" class="nav-btn">Đơn hàng</a>
        <a href="#" class="nav-btn nav-btn-danger" id="btnLogout">Đăng xuất</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', e => {
        e.preventDefault();
        if (confirm('Bạn có chắc muốn đăng xuất?')) apiLogout();
      });
    } else {
      navAuth.innerHTML = `
        <a href="/pages/login.html" class="nav-btn">Đăng nhập</a>
        <a href="/pages/login.html?tab=register" class="nav-btn">Đăng ký</a>
      `;
    }
  }

  // -------------------------------------------------------
  // Render sản phẩm
  // -------------------------------------------------------
  function renderProducts(products) {
    const grid = document.getElementById('productGrid');
    document.getElementById('productCount').textContent = `${products.length} sản phẩm`;
    if (!products.length) {
      grid.innerHTML = '<div class="empty">Không tìm thấy sản phẩm nào.</div>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const price = p.basePrice * (1 - (p.discountPercent || 0) / 100);
      return `
        <div class="product-card" onclick="openModal(${p.id})">
          <div class="product-img">
            ${p.imageUrl
              ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.parentElement.textContent='Không có ảnh'" />`
              : 'Không có ảnh'}
          </div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-category">${p.category?.categoryName || ''}</div>
            <div class="product-price">
              ${formatPrice(price)}
              ${p.discountPercent > 0 ? `<span class="original">${formatPrice(p.basePrice)}</span>` : ''}
            </div>
            <div class="product-footer">
              ${p.discountPercent > 0 ? `<span class="discount-badge">-${p.discountPercent}%</span>` : '<span></span>'}
              <button class="add-cart-btn" onclick="event.stopPropagation(); handleAddToCart(${p.id})">
                + Giỏ hàng
              </button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function filterProducts() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    let filtered = selectedCategory
      ? allProducts.filter(p => p.category?.id === selectedCategory)
      : allProducts;
    if (kw) filtered = filtered.filter(p => p.name.toLowerCase().includes(kw));
    renderProducts(filtered);
  }

  function selectCategory(id, btn) {
    selectedCategory = id;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterProducts();
  }

  // -------------------------------------------------------
  // Thêm giỏ hàng — addToCart trong api.js tự xử lý
  // nếu chưa login sẽ toast + redirect login
  // -------------------------------------------------------
  function handleAddToCart(productId) {
    const p = allProducts.find(x => x.id === productId);
    if (p) addToCart(p);
  }

  // -------------------------------------------------------
  // Modal chi tiết sản phẩm
  // -------------------------------------------------------
  function openModal(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    currentProduct = p;
    const price = p.basePrice * (1 - (p.discountPercent || 0) / 100);
    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalImg').src = p.imageUrl || '';
    document.getElementById('modalImg').style.display = p.imageUrl ? 'block' : 'none';
    document.getElementById('modalPrice').textContent = formatPrice(price);
    document.getElementById('modalDesc').textContent = p.description || 'Không có mô tả.';
    document.getElementById('modalQty').value = 1;
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function changeQty(d) {
    const inp = document.getElementById('modalQty');
    inp.value = Math.max(1, parseInt(inp.value) + d);
  }

  function addToCartFromModal() {
    if (!currentProduct) return;
    const qty = parseInt(document.getElementById('modalQty').value) || 1;
    const ok = addToCart(currentProduct, qty);
    if (ok) closeModal();
  }

  // -------------------------------------------------------
  // Load sản phẩm từ API (public, không cần token)
  // -------------------------------------------------------
  async function loadProducts() {
    try {
      allProducts = await apiGetProducts();
      renderProducts(allProducts);

      // Render filter danh mục
      const cats = [...new Map(
        allProducts.filter(p => p.category)
                   .map(p => [p.category.id, p.category])
      ).values()];
      const filterDiv = document.getElementById('categoryFilters');
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat.categoryName;
        btn.onclick = () => selectCategory(cat.id, btn);
        filterDiv.appendChild(btn);
      });
    } catch {
      document.getElementById('productGrid').innerHTML =
        '<div class="empty">Không thể tải sản phẩm. Kiểm tra backend đang chạy.</div>';
    }
  }

  // -------------------------------------------------------
  // Khởi chạy
  // -------------------------------------------------------
  renderNav();   // Render nav theo login state
  loadProducts(); // Load sản phẩm (public)
</script>
</body>
</html>
