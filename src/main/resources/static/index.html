<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVN - Trang chủ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }
    nav { background:#fff; border-bottom:1px solid #eee; padding:0 2rem; display:flex; align-items:center; gap:1rem; height:60px; position:sticky; top:0; z-index:100; }
    .logo { font-size:1.4rem; font-weight:700; color:#111; text-decoration:none; margin-right:auto; }
    .logo span { color:#e53935; }
    .search-bar { display:flex; align-items:center; border:1px solid #ddd; border-radius:8px; overflow:hidden; width:340px; }
    .search-bar input { border:none; outline:none; padding:0.5rem 1rem; font-size:0.9rem; width:100%; }
    .search-bar button { background:#111; color:#fff; border:none; padding:0.5rem 1rem; cursor:pointer; font-size:0.9rem; }
    .nav-actions { display:flex; align-items:center; gap:0.75rem; }
    .nav-btn { text-decoration:none; color:#111; font-size:0.875rem; padding:0.4rem 0.8rem; border-radius:6px; border:1px solid #ddd; transition:background 0.2s; white-space:nowrap; }
    .nav-btn:hover { background:#f5f5f5; }
    .nav-btn-danger { color:#e53935; border-color:#e53935; }
    .nav-btn-danger:hover { background:#fff3f3; }
    .cart-wrap { position:relative; }
    .cart-badge { position:absolute; top:-6px; right:-6px; background:#e53935; color:#fff; border-radius:50%; width:18px; height:18px; font-size:11px; display:flex; align-items:center; justify-content:center; }
    .user-name { font-size:0.875rem; color:#555; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .hero { background:#111; color:#fff; padding:3rem 2rem; text-align:center; }
    .hero h1 { font-size:2rem; font-weight:700; margin-bottom:0.5rem; }
    .hero p { color:#aaa; }
    .main { max-width:1200px; margin:0 auto; padding:2rem; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .section-title { font-size:1.2rem; font-weight:600; }
    .filters { display:flex; gap:0.75rem; margin-bottom:2rem; flex-wrap:wrap; }
    .filter-btn { padding:0.4rem 1rem; border:1px solid #ddd; border-radius:20px; background:#fff; font-size:0.875rem; cursor:pointer; transition:all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background:#111; color:#fff; border-color:#111; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1.25rem; }
    .product-card { background:#fff; border-radius:12px; border:1px solid #eee; overflow:hidden; transition:transform 0.2s, box-shadow 0.2s; cursor:pointer; }
    .product-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.08); }
    .product-img { width:100%; height:200px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:0.85rem; overflow:hidden; }
    .product-img img { width:100%; height:100%; object-fit:cover; }
    .product-info { padding:1rem; }
    .product-name { font-size:0.95rem; font-weight:500; margin-bottom:0.25rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .product-category { font-size:0.8rem; color:#888; margin-bottom:0.5rem; }
    .product-price { font-size:1.1rem; font-weight:700; color:#e53935; }
    .original { font-size:0.85rem; color:#aaa; text-decoration:line-through; margin-left:0.5rem; font-weight:400; }
    .product-footer { display:flex; align-items:center; justify-content:space-between; margin-top:0.75rem; }
    .discount-badge { background:#fff3f3; color:#e53935; font-size:0.75rem; padding:0.2rem 0.5rem; border-radius:4px; font-weight:600; }
    .add-cart-btn { background:#111; color:#fff; border:none; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.8rem; cursor:pointer; }
    .add-cart-btn:hover { background:#333; }
    .empty { text-align:center; padding:3rem; color:#888; }
    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; border-radius:16px; padding:2rem; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .modal-title { font-size:1.2rem; font-weight:600; }
    .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888; }
    .modal-img { width:100%; height:280px; object-fit:cover; border-radius:10px; background:#f0f0f0; margin-bottom:1.5rem; }
    .modal-price { font-size:1.5rem; font-weight:700; color:#e53935; margin-bottom:0.5rem; }
    .modal-desc { font-size:0.9rem; color:#555; line-height:1.6; margin-bottom:1.5rem; }
    .quantity-row { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; }
    .qty-btn { width:32px; height:32px; border:1px solid #ddd; background:#fff; border-radius:6px; font-size:1.1rem; cursor:pointer; }
    .qty-input { width:60px; text-align:center; border:1px solid #ddd; border-radius:6px; padding:0.3rem; font-size:1rem; outline:none; }
    .modal-add-btn { width:100%; padding:0.85rem; background:#111; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
    .modal-add-btn:hover { background:#333; }
    .out-of-stock { opacity: 0.6; filter: grayscale(100%);}
    .out-badge { position: absolute; top: 8px; left: 8px; background: #e53935; color: #fff; padding: 4px 8px; font-size: 12px; border-radius: 6px; }
    .product-img { position: relative; }
      </style>
</head>
<body>

<nav>
  <a href="/index.html" class="logo">Shop<span>VN</span></a>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Tìm sản phẩm..." oninput="filterProducts()"/>
    <button onclick="filterProducts()">Tìm</button>
  </div>

  <div class="nav-actions">
    <!-- Cart luôn hiển thị -->
    <div class="cart-wrap">
      <a href="/pages/cart.html" class="nav-btn">🛒 Giỏ hàng</a>
      <span class="cart-badge" id="cartBadge">0</span>
    </div>

    <!-- Nav động theo trạng thái đăng nhập — render bằng JS -->
    <div id="navAuth"></div>
  </div>
</nav>

<div class="hero">
  <h1>Chào mừng đến ShopVN</h1>
  <p>Khám phá hàng ngàn sản phẩm chất lượng với giá tốt nhất</p>
</div>

<div class="main">
  <div class="section-header">
    <h2 class="section-title">Tất cả sản phẩm</h2>
    <span id="productCount" style="color:#888; font-size:0.875rem;"></span>
  </div>
  <div class="filters" id="categoryFilters"> </div>
  <div class="product-grid" id="productGrid">
    <div class="empty">Đang tải sản phẩm...</div>
  </div>
</div>

<!-- Modal chi tiết sản phẩm -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">

    <div class="modal-header">
      <h3 class="modal-title" id="modalName"></h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <img class="modal-img" id="modalImg" src="" alt="" />

    <div class="modal-price" id="modalPrice"></div>

<div class="modal-desc">
  <b>Danh mục: </b><span id="modalCategory"></span>
</div>

<div class="modal-desc">
  <b>Mô tả: </b><span id="modalDesc"></span>
</div>

    <div class="modal-desc">
      <b>Biến thể: </b> <select id="modalVariant"></select>
    </div>
    <!-- ✅ thêm -->

    <div class="quantity-row">
      <span style="font-size:0.9rem;color:#555;">Số lượng:</span>
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <input class="qty-input" type="number" id="modalQty" value="1" min="1" />
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>

    <button class="modal-add-btn" id="modalAddBtn" onclick="addToCartFromModal()"> Thêm vào giỏ hàng </button>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let allProducts = [];
  let currentProduct = null;
  let selectedCategory = null;
  let sortType = "";

  // -------------------------------------------------------
  // Render nav động theo trạng thái login
  // Không dùng id="logoutBtn" để tránh xung đột với api.js
  // -------------------------------------------------------
  function renderNav() {
    const navAuth = document.getElementById('navAuth');
    const user = getUser();

    if (isLoggedIn() && user) {
      navAuth.innerHTML = `
        <span class="user-name">Xin chào, ${user.name || user.email}</span>
        <a href="/pages/orders.html" class="nav-btn">Đơn hàng</a>
        <a href="#" class="nav-btn nav-btn-danger" id="btnLogout">Đăng xuất</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', e => {
        e.preventDefault();
        if (confirm('Bạn có chắc muốn đăng xuất?')) apiLogout();
      });
    } else {
      navAuth.innerHTML = `
        <a href="/pages/login.html" class="nav-btn">Đăng nhập</a>
        <a href="/pages/login.html?tab=register" class="nav-btn">Đăng ký</a>
      `;
    }
  }

  // -------------------------------------------------------
  // Render sản phẩm
  // -------------------------------------------------------
  // -------------------------------------------------------
// Render sản phẩm
// -------------------------------------------------------
function renderProducts(products) {

  const grid = document.getElementById('productGrid');

  document.getElementById('productCount').textContent =
    `${products.length} sản phẩm`;

  if (!products.length) {
    grid.innerHTML =
      '<div class="empty">Không tìm thấy sản phẩm nào.</div>';
    return;
  }

  grid.innerHTML = products.map(p => {

    let price = p.price || 0;
let stock = p.stockQuantity || 0;

if (p.variants && p.variants.length > 0) {

  let minVariant = null;

  p.variants.forEach(v => {

    // chỉ lấy variant còn hàng

    if (v.stockQuantity > 0) {

      if (
        minVariant === null ||
        v.price < minVariant.price
      ) {
        minVariant = v;
      }

    }

  });


  // nếu có variant còn hàng

  if (minVariant) {

    price = minVariant.price;
    stock = minVariant.stockQuantity;

  }

  // nếu tất cả hết hàng → lấy rẻ nhất luôn

  else {

    let cheapest = p.variants[0];

    p.variants.forEach(v => {

      if (v.price < cheapest.price) {
        cheapest = v;
      }

    });

    price = cheapest.price;
    stock = 0;

  }
}
    // category name
    const categoryName = p.category?.categoryName || '';

    // ảnh
    const image = p.imageUrl || '';

    const isOut = isOutOfStockProduct(p); 
    return `
  <div class="product-card ${isOut ? 'out-of-stock' : ''}"
       onclick="openModal(${p.id})">

    <div class="product-img">
      ${
        image
          ? `<img src="${image}"
                  alt="${p.name}"
                  onerror="this.parentElement.textContent='Không có ảnh'"/>`
          : "Không có ảnh"
      }
      ${isOut ? '<div class="out-badge">Hết hàng</div>' : ''}
    </div>

    <div class="product-info">

      <div class="product-name">${p.name}</div>

      <div class="product-category">${categoryName}</div>

      <div class="product-price">
        ${formatPrice(price)}
      </div>

      <div class="product-footer">

        <span class="stock">
          ${isOut ? 'Hết hàng' : `Còn ${stock}`}
        </span>

        ${
          isOut
            ? ''
            : `
          <button
            class="add-cart-btn"
            onclick="event.stopPropagation(); handleAddToCart(${p.id})"
          >
            + Giỏ hàng
          </button>
        `
        }
      </div>
    </div>
  </div>
`;
}).join('');
}

  function renderCategoryFilters() {

  const box = document.getElementById("categoryFilters");

  box.innerHTML = "";

  // ===== SORT SELECT =====

  const select = document.createElement("select");

  select.className = "filter-btn";

  select.innerHTML = `
    <option value="">Sắp xếp</option>
    <option value="priceAsc">Giá tăng</option>
    <option value="priceDesc">Giá giảm</option>
  `;

  select.onchange = function () {

    sortType = this.value;

    filterProducts();

  };

  box.appendChild(select);


  // ===== TẤT CẢ =====

  const allBtn = document.createElement("button");

  allBtn.className = "filter-btn active";

  allBtn.textContent = "Tất cả";

  allBtn.onclick = () => selectCategory(null, allBtn);

  box.appendChild(allBtn);


  // ===== LẤY CATEGORY =====

  const map = new Map();

  allProducts.forEach(p => {

    if (p.category) {

      map.set(
        p.category.id,
        p.category.categoryName
      );

    }

  });


  // ===== BUTTON CATEGORY =====

  map.forEach((name, id) => {

    const btn = document.createElement("button");

    btn.className = "filter-btn";

    btn.textContent = name;

    btn.onclick = () => selectCategory(id, btn);

    box.appendChild(btn);

  });

}

  function filterProducts() {

  const kw =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  let filtered = [...allProducts];


  // ===== FILTER CATEGORY =====

  if (selectedCategory) {

    filtered = filtered.filter(p =>

      p.category &&
      p.category.id === selectedCategory

    );

  }


  // ===== SEARCH =====

  if (kw) {

    filtered = filtered.filter(p =>

      p.name
        .toLowerCase()
        .includes(kw)

    );

  }


  // ===== SORT PRICE =====

  if (sortType === "priceAsc") {

    filtered.sort(
      (a, b) =>
        getProductPrice(a) -
        getProductPrice(b)
    );

  }

  if (sortType === "priceDesc") {

    filtered.sort(
      (a, b) =>
        getProductPrice(b) -
        getProductPrice(a)
    );

  }

  // Lọc stock = 0 cho xuống cuối
  filtered.sort((a, b) => {
  const outA = isOutOfStockProduct(a);
  const outB = isOutOfStockProduct(b);

  if (outA && !outB) return 1;
  if (!outA && outB) return -1;
  return 0;
});


  renderProducts(filtered);

}

  // ── updateModalButton: set inp.max, clamp value, ẩn/hiện nút ─────────────
  function updateModalButton() {
    const select   = document.getElementById("modalVariant");
    const btn      = document.getElementById("modalAddBtn");
    const qtyInput = document.getElementById("modalQty");

    if (isOutOfStockProduct(currentProduct)) {
      btn.style.display = "none";
      return;
    }

    const variantId = Number(select.value);
    const v = currentProduct.variants.find(x => x.id === variantId);
    const maxQty = getMaxQty(v);   // stock - inCart

    if (!v || maxQty <= 0) {
      btn.style.display = "none";
    } else {
      btn.style.display = "block";
    }

    // ── Luôn set lại inp.max ở đây ──
    qtyInput.max = maxQty > 0 ? maxQty : 0;

    // Clamp giá trị hiện tại nếu vượt quá
    const current = parseInt(qtyInput.value) || 1;
    if (current > maxQty) {
      qtyInput.value = maxQty > 0 ? maxQty : 1;
    }
  }

  function selectCategory(id, btn) {
    selectedCategory = id;
    document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterProducts();
  }

  function getProductPrice(p) {

  let price = p.price || 0;

  if (p.variants && p.variants.length > 0) {

    price = Math.min(
      ...p.variants.map(v => v.price)
    );

  }

  return price;
}
  // -------------------------------------------------------
  // Thêm giỏ hàng — addToCart trong api.js tự xử lý
  // nếu chưa login sẽ toast + redirect login
  // -------------------------------------------------------
  // ── handleAddToCart: check maxQty trước khi add ──────────────────────────
  function handleAddToCart(productId) {
    const p = allProducts.find(x => x.id === productId);
    if (!p) return;

    if (p.variants.length === 1) {
      const v = p.variants[0];
      const inCart = getCartQuantity(v.id);
      const maxQty = v.stockQuantity - inCart;   // ← dùng lại maxQty đúng

      if (maxQty <= 0) {
        showToast("Sản phẩm đã đạt tối đa trong giỏ hàng", "error");
        return;
      }

      addToCart(p, 1, v.id);   // chỉ add 1, đã check ở trên
      return;
    }

    openModal(productId);
  }

  // -------------------------------------------------------
  // Modal chi tiết sản phẩm
  // -------------------------------------------------------
function openModal(productId) {

  const p = allProducts.find(x => x.id === productId);
  if (!p) return;

  currentProduct = p;
  const addBtn = document.getElementById("modalAddBtn");

if (isOutOfStockProduct(p)) {
  addBtn.style.display = "none";
} else {
  addBtn.style.display = "block";
}

  const image = p.imageUrl || "";
  const price = p.price || 0;
  const desc = p.description || "";
  const category = p.category?.categoryName || "";
  const stock = p.stockQuantity ?? "-";

  document.getElementById("modalName").textContent = p.name;
  document.getElementById("modalImg").src = image;
  document.getElementById("modalImg").style.display = image ? "block" : "none";
  document.getElementById("modalPrice").textContent =  getPriceRange(p);
  document.getElementById("modalDesc").textContent = desc;
  document.getElementById("modalCategory").textContent = category;
  document.getElementById("modalQty").value = 1;
  
  // const qtyInput = document.getElementById("modalQty");

  // qtyInput.oninput = function () {
  // const max = Number(this.max) || 1;

  // if (this.value < 1) this.value = 1;

  // if (this.value > max) {
  //   alert("Quá số lượng tồn kho của sản phẩm");
  //   this.value = max;
  // }
  // };

// ===== variant select =====
const select = document.getElementById("modalVariant");
select.onchange = updateModalButton;
select.innerHTML = "";

if (p.variants && p.variants.length > 0) {

  // ===== tìm variant rẻ nhất còn hàng =====
  let defaultVariant = null;

  p.variants.forEach(v => {
    if (v.stockQuantity > 0) {
      if (!defaultVariant || v.price < defaultVariant.price) {
        defaultVariant = v;
      }
    }
  });

  // nếu tất cả hết hàng → lấy rẻ nhất
  if (!defaultVariant) {
    defaultVariant = p.variants.reduce((min, v) =>
      v.price < min.price ? v : min
    );
  }

  // ===== render option =====
  p.variants.forEach(v => {

    const opt = document.createElement("option");
    opt.value = v.id;

    // text luôn phải set
    opt.textContent =
      v.sku +
      " - " +
      formatPrice(v.price) +
      " (Tồn kho: " +
      v.stockQuantity +
      ")";

    // chọn mặc định
    if (defaultVariant && v.id === defaultVariant.id) {
      opt.selected = true;
    }

    select.appendChild(opt);
  });

  select.style.display = "block";

    // set max theo variant mặc định
// const selectedId = Number(select.value);
// const selectedVariant = p.variants.find(v => v.id === selectedId);

  // 👉 gọi update
  updateModalButton();

} else {

  const opt = document.createElement("option");
  opt.value = "";
  opt.textContent = "Không có biến thể";
  select.appendChild(opt);
  }
  
  document.getElementById("modalOverlay").classList.add("show");
}

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }


  function addToCartFromModal() {

    if (!currentProduct) return;

    const qty = Number(
      document.getElementById("modalQty").value
    );

    const variantId = Number(
      document.getElementById("modalVariant").value
    );

    if (!variantId) {
      alert("Hãy chọn biến thể");
      return;
    }

    addToCart(currentProduct, qty, variantId);

    closeModal();
  }

  // Các hàm function 
  // Check xem sản phẩm hết hàng chưa? all variant stock = 0
  function isOutOfStockProduct(p) {
  if (!p.variants || p.variants.length === 0) {
    return (p.stockQuantity || 0) <= 0;
  }
  return p.variants.every(v => v.stockQuantity <= 0);
}

  // Hiển thị min-max price, chỉ tính stock > 0
  function getPriceRange(p) {
    if (!p.variants || p.variants.length === 0) {
      return formatPrice(p.price || 0);
    }

    const valid = p.variants.filter(v => v.stockQuantity > 0);

    if (valid.length === 0) return "Hết hàng";

    const prices = valid.map(v => v.price);

    const min = Math.min(...prices);
    const max = Math.max(...prices);

    return min === max
      ? formatPrice(min)
      : `${formatPrice(min)} - ${formatPrice(max)}`;
  }

   // ── changeQty: đọc max từ input.max (đã được set bởi updateModalButton) ──
  function changeQty(d) {
    const inp = document.getElementById("modalQty");
    const max = Number(inp.max) || 0;
    let val = parseInt(inp.value) + d;

    if (val < 1) val = 1;

    if (val > max) {
      showToast("Vượt quá số lượng tồn kho của sản phẩm", "error");
      val = max;
    }

    inp.value = val;
  }

    function getMaxQty(variant) {
    if (!variant) return 0;
    const inCart = getCartQuantity(variant.id);
    return Math.max(variant.stockQuantity - inCart, 0);
  }


  // -------------------------------------------------------
  // Load sản phẩm từ API (public, không cần token)
  // -------------------------------------------------------
  async function loadProducts() {
    try {
      allProducts = await apiGetProducts();
      // renderCategoryFilters();
      renderProducts(allProducts);
      renderCategoryFilters();
      filterProducts();
    } catch {
      document.getElementById('productGrid').innerHTML =
        '<div class="empty">Không thể tải sản phẩm. Kiểm tra backend đang chạy.</div>';
    }
  }

  // -------------------------------------------------------
  // Khởi chạy
  // -------------------------------------------------------
  renderNav();   // Render nav theo login state
  loadProducts(); // Load sản phẩm (public)
  filterProducts(); // sắp xếp product stock = 0 
  document.getElementById("modalQty").oninput = function () {
    const max = Number(this.max) || 0;

    if (this.value < 1) this.value = 1;

    if (Number(this.value) > max) {
      showToast("Vượt quá số lượng tồn kho của sản phẩm", "error");
      this.value = max;
    }
  };
</script>
</body>
</html>
